<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Recorded</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0d;
      --surface: #14141b;
      --line: #2a2a36;
      --text: #f2f2f6;
      --muted: #9797a8;
      --accent: #ff3b5c;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f7f6f3;
        --surface: #fff;
        --line: #e0dcd3;
        --text: #17151a;
        --muted: #6b6672;
        --accent: #e42a4d;
      }
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(1100px 600px at 50% -20%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 65%), var(--bg);
      color: var(--text);
    }
    main {
      width: min(100%, 520px);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }
    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .mark::after {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: inset 0 0 0 7px var(--surface);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 38px); letter-spacing: -.035em; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.65; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p class="eyebrow">404 · tape not found</p>
    <h1>Nothing recorded here.</h1>
    <p>This address is not part of Recorded. The app uses hash routes, so everything lives under the main page — try trending, search, or settings from there.</p>
    <a href="./">Back to Recorded</a>
  </main>
</body>
</html>
